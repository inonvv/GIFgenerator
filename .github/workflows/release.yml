name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download ffmpeg.exe (Gyan essentials build)
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ff = Get-ChildItem -Recurse -Path ffmpeg_extracted -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName -Destination vendor/ffmpeg.exe

      - name: Download latest yt-dlp.exe
        shell: pwsh
        run: |
          $url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          Invoke-WebRequest -Uri $url -OutFile vendor/yt-dlp.exe

      - name: Build with PyInstaller
        shell: pwsh
        run: pyinstaller --clean gifgen.spec

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/GIFGenerator.exe
          generate_release_notes: true
